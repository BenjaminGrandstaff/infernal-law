apiVersion: v1
kind: Service
metadata:
  name: infernal-law
  labels:
    app.kubernetes.io/name: infernal-law
spec:
  selector:
    app.kubernetes.io/name: infernal-law
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    # infernal-client-rs's SignedRequest always dials https://<authority>
    # with no explicit port, which resolves to 443 -- callers using it
    # (infernal-taskmaster-simple, infernal-worker-simple, and so on) need
    # this port to reach the tls-proxy sidecar (deployment.yaml), not the
    # kernel's own plain-HTTP listener directly.
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  type: ClusterIP
