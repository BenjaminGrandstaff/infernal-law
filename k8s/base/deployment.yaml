apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernal-law
  labels:
    app.kubernetes.io/name: infernal-law
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infernal-law
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernal-law
    spec:
      automountServiceAccountToken: false
      serviceAccountName: infernal-law
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infernal-law
          image: localhost/infernal-law:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: INFERNAL_LAW_SERVICE_ID
              value: "00000000-0000-4000-8000-000000000001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infernal-law-database
                  key: url
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubernetes-reviewer
              mountPath: /var/run/secrets/infernal-law-kubernetes
              readOnly: true
      volumes:
        - name: kubernetes-reviewer
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      terminationGracePeriodSeconds: 10
