apiVersion: apps/v1
kind: Deployment
metadata:
  name: infernal-law
  labels:
    app.kubernetes.io/name: infernal-law
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infernal-law
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infernal-law
    spec:
      automountServiceAccountToken: false
      serviceAccountName: infernal-law
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Without this, the kubernetes-reviewer volume's ca.crt (mode 0400,
        # confirmed here to be owned by root regardless of runAsUser/
        # runAsGroup above) is unreadable by this container's own process,
        # and KubernetesTokenReviewer::from_env() fails closed with a
        # generic "enrollment could not be completed" -- undetected until
        # /v1/enrollments was actually exercised against a real cluster
        # for the first time. fsGroup makes the kubelet mount every
        # volume's files as group-owned by this GID instead.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: infernal-law
          image: localhost/infernal-law:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: INFERNAL_LAW_SERVICE_ID
              value: "00000000-0000-4000-8000-000000000001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infernal-law-database
                  key: url
            # In-cluster DNS name of infernal-inquisitor-simple's own
            # Service. Must be provisioned as an identities row out of
            # band (see NO_ARTIFACT_SCHEMA_VERSION's own doc comment for
            # why every ILK-002-gated route needs one) before ILK-002
            # authority decisions (request acceptance, subscription
            # create/disable) will do anything but fail closed.
            - name: POLICY_EVALUATOR_AUTHORITY
              value: "infernal-inquisitor-simple"
            - name: POLICY_EVALUATOR_ID
              value: "00000000-0000-4000-8000-000000000005"
            # infernal-inquisitor-simple's own tls-proxy sidecar uses a
            # self-signed certificate for local/test deployments (see
            # that repo's README), which this process must be told to
            # trust explicitly -- see the evaluator-ca-cert volume below.
            # Omit both for an evaluator with an ordinary
            # publicly-trusted certificate.
            - name: POLICY_EVALUATOR_CA_CERT_PATH
              value: /etc/infernal-inquisitor-simple/ca/ca.crt
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kubernetes-reviewer
              mountPath: /var/run/secrets/infernal-law-kubernetes
              readOnly: true
            - name: evaluator-ca-cert
              mountPath: /etc/infernal-inquisitor-simple/ca
              readOnly: true
        # Terminates TLS in front of the kernel's own plain-HTTP listener.
        # infernal-client-rs's outbound SignedRequest always dials
        # https://<authority> (never plain HTTP), so any caller using it
        # -- infernal-taskmaster-simple, infernal-worker-simple, or a
        # future policy evaluator call -- needs a real TLS endpoint to
        # reach, not just the plain-HTTP Service this Deployment exposed
        # before. The signature itself is unaffected either way: it
        # covers method/target_uri/content-digest/etc, not the transport,
        # and target_uri's authority survives the proxy hop only because
        # tls-proxy-configmap.yaml explicitly forwards the original Host
        # header (see that file's comment).
        - name: tls-proxy
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: tls-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tls-proxy-certificate
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: tls-proxy-cache
              mountPath: /var/cache/nginx
            - name: tls-proxy-run
              mountPath: /var/run
            - name: tls-proxy-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: kubernetes-reviewer
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: tls-proxy-config
          configMap:
            name: infernal-law-tls-proxy
        # Not committed: create with, for example,
        #   kubectl create configmap evaluator-ca-cert \
        #     --from-file=ca.crt=infernal-inquisitor-simple-tls.crt
        # using the same self-signed certificate
        # infernal-inquisitor-simple's own tls-proxy sidecar serves.
        - name: evaluator-ca-cert
          configMap:
            name: evaluator-ca-cert
        # Not committed: create with, for example,
        #   kubectl create secret tls infernal-law-tls \
        #     --cert=tls.crt --key=tls.key
        # (see README's Kubernetes section for the full openssl command
        # that generates a self-signed certificate for local testing).
        - name: tls-proxy-certificate
          secret:
            secretName: infernal-law-tls
        - name: tls-proxy-cache
          emptyDir: {}
        - name: tls-proxy-run
          emptyDir: {}
        - name: tls-proxy-tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 10
